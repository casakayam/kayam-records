          <p>
            Kayam Records is a professional recording studio and artist residency located in Guatapé,
            Antioquia, Colombia, about 2 hours from Medellín. Artists arrive with a project and leave
            with a finished EP, recording in an acoustically treated studio with on-site accommodation
            included. The studio is run by founder and sound engineer Jérôme Filippi (SAE Institute Paris)
            and works in English and Spanish across all genres, from Latin music and reggaeton to rock,
            electronic and classical.
          </p>

          <ul>
            <li>Recording session: $25/hour</li>

            <li>Music production: $350/track</li>
            <li>Mixing: $180/track</li>
            <li>Mastering: $70/track</li>
            <li>Rehearsal room: $10/hour</li>
            <li>Production classes (Kayam Academy): $20/hour</li>
          </ul>

          </ul>

            Kayam Records also offers 7, 15 and 30-day artistic residency packages combining studio time

          </p>
